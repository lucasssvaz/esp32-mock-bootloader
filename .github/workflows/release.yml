# Production: push tag v*.*.* only → PyPI + GitHub Release (clean version from tag).
# Test: Actions → Release → Run workflow (no inputs) → TestPyPI with auto .dev version.
#
# Trusted publishers (PyPI and TestPyPI): owner lucasssvaz, repo esp32-mock-bootloader,
# workflow release.yml, environment pypi.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  testpypi:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve TestPyPI version
        id: meta
        run: |
          pip install --quiet hatch hatch-vcs
          clean=$(hatch version | sed 's/+.*//')
          prefix=$(echo "$clean" | sed -E 's/\.dev[0-9]+$//')
          ver="${prefix}.dev${GITHUB_RUN_NUMBER}"
          echo "pretend=${ver}" >> "$GITHUB_OUTPUT"
          echo "TestPyPI version: ${ver}"

      - name: Build wheel and sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.meta.outputs.pretend }}
        run: |
          hatch build
          ls -la dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        run: |
          pip install --quiet hatch hatch-vcs
          ver=$(hatch version)
          echo "Release version: ${ver}"
          if echo "$ver" | grep -qE '\.dev'; then
            echo "::error::Refusing to publish dev version ${ver} to PyPI. Tag a release (v*.*.*) instead."
            exit 1
          fi

      - name: Build wheel and sdist
        run: |
          hatch build
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
